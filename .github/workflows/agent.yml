name: Internship agent

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: internship-agent
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the agent
        run: python scripts/agent.py
        env:
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}

      - name: Save memory and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "internship-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Agent: refresh internship data"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages rebuild request skipped."
